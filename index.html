 $('ds').innerHTML=D.map(function(d){return '<option value="'+d[0]+'.ly">'+d[0]+'.ly</option>'}).join('')+'<option value="other">'+T('نطاق آخر / استفسار عام','Other Domain / General Inquiry')+'</option>';
 $('whyl').innerHTML=WY.map(function(s){return '<li><span>'+A(s[1],s[2],'b')+A(s[3],s[4],'span')+'</span></li>'}).join('');

 $('top3').innerHTML=T3.map(function(s){return '<div class="box"><div class="ico" style="font-size:2.3rem">'+s[0]+'</div><h4>'+s[1]+'</h4>'+A(s[2],s[3],'p')+'</div>'}).join('');

}
function filt(){
 var q=$('q').value.trim().toLowerCase(),n=0;
 document.querySelectorAll('.card[data-c]').forEach(function(c){var ok=(cat==='all'||c.dataset.c===cat)&&(!q||c.textContent.toLowerCase().indexOf(q)>-1);c.classList.toggle('dis',!ok);if(ok)n++});
 $('nr').classList.toggle('show',n===0);$('dn').textContent=D.length;
 document.querySelectorAll('.chip').forEach(function(b){b.classList.toggle('on',b.dataset.c===cat)});
 $('cnt').innerHTML=T('عرض <b>'+n+'</b> من '+D.length+' نطاقاً','Showing <b>'+n+'</b> of '+D.length+' domains');
}
function lang(l){
 L=l;document.documentElement.lang=l;document.documentElement.dir=l==='ar'?'rtl':'ltr';document.body.classList.toggle('en',l==='en');
 $('bar').classList.toggle('on',l==='ar');$('ben').classList.toggle('on',l==='en');
 document.querySelectorAll('[data-ar]').forEach(function(e){e.textContent=e.getAttribute('data-'+l)});
 build();filt();
 try{localStorage.setItem('nl_lang',l)}catch(x){}
}
function toDomains(){$('domains').scrollIntoView({behavior:'smooth'})}
document.addEventListener('DOMContentLoaded',function(){
 var s='ar';try{s=localStorage.getItem('nl_lang')||'ar'}catch(x){}
 $('bar').onclick=function(){lang('ar')};$('ben').onclick=function(){lang('en')};
 $('chips').addEventListener('click',function(e){var b=e.target.closest('.chip');if(b){cat=b.dataset.c;filt();toDomains()}});
 $('grid').addEventListener('click',function(e){var b=e.target.closest('.of');if(b){$('ds').value=b.dataset.n;$('contact').scrollIntoView({behavior:'smooth'})}});
 $('q').addEventListener('input',filt);
 $('q').addEventListener('keydown',function(e){if(e.key==='Enter')toDomains()});
 $('go').onclick=toDomains;
 document.querySelectorAll('.try button').forEach(function(b){b.onclick=function(){$('q').value=b.dataset.t;filt();toDomains()}});
 var mb=$('mb'),mp=$('mp');
 mb.onclick=function(){var o=mp.classList.toggle('open');mb.setAttribute('aria-expanded',o);mb.textContent=o?'×':'☰'};
 mp.querySelectorAll('a').forEach(function(a){a.onclick=function(){mp.classList.remove('open');mb.textContent='☰'}});
 lang(s);
 try{fetch('domains-extra.json',{cache:'no-store'}).then(function(r){return r.ok?r.json():null}).then(function(x){if(!x)return;var k=x.categories||{};Object.keys(k).forEach(function(c){C[c]=k[c]});(x.domains||[]).forEach(function(e){if(!D.some(function(d){return d[0].toLowerCase()===e.name.toLowerCase()}))D.push([e.name,e.cat,e.ar,e.en,'x'])});lang(L)}).catch(function(){})}catch(e){}
});
