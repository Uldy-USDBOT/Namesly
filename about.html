<style>:root{--ol:#556B2F;--ol2:#6B8E23;--dk:#2F3B1A;--lt:#D4E38A;--fg:#1f2a12;--mu:#5f6b4d;--soft:#f3f6ea;--ln:#e6ebd6;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}html{scroll-behavior:smooth}
body{background:#fff;color:var(--fg);font-family:'Cairo',sans-serif;line-height:1.7;overflow-x:hidden}body.en{font-family:'Inter',sans-serif}
a{color:inherit;text-decoration:none}button{font:inherit;cursor:pointer}
.wrap{width:min(1100px,calc(100% - 32px));margin:0 auto}
header{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.94);backdrop-filter:blur(14px);border-bottom:1px solid var(--ln)}
.hd{display:flex;align-items:center;gap:12px;min-height:66px}.hd .logo{margin-inline-end:auto}
.logo{display:flex;align-items:center;gap:10px}.logo>span{direction:ltr;text-align:start;font:800 1.2rem Inter;letter-spacing:-.03em}.logo b{color:var(--ol2)}.logo svg{width:36px;height:36px}
.lang{display:flex;background:var(--soft);border-radius:99px;padding:4px}.lang button{border:0;background:none;color:var(--fg);font-size:.78rem;font-weight:800;padding:6px 12px;border-radius:99px}.lang button.on{background:var(--ol);color:#fff}
.back{font-weight:800;font-size:.85rem;color:var(--ol)}
.hero{background:linear-gradient(135deg,#2F3B1A,#556B2F 58%,#6B8E23);color:#fff;padding:56px 0 48px;border-radius:0 0 50% 50%/0 0 40px 40px}
.crumb{font-size:.8rem;color:rgba(255,255,255,.7)}.crumb a:hover{color:#fff}
.tag{display:inline-block;font:800 .68rem Inter;letter-spacing:.12em;text-transform:uppercase;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);padding:6px 13px;border-radius:99px;margin-top:18px}
h1{font:500 clamp(2.6rem,9vw,4.8rem) Fraunces,Georgia,serif;line-height:1.05;margin-top:14px;direction:ltr;text-align:start}h1 i{font-style:normal;color:var(--lt)}
.lead{max-width:640px;margin-top:14px;color:rgba(255,255,255,.82);font-size:1.05rem}
.cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}
.b{display:inline-flex;align-items:center;gap:8px;padding:13px 26px;border-radius:99px;font-weight:800;font-size:.9rem;border:0}
.b1{background:#fff;color:var(--dk)}.b1:hover{background:var(--lt)}.b2{border:2px solid #fff;color:#fff;background:none}.b2:hover{background:#fff;color:var(--dk)}
section{padding:52px 0}.soft{background:var(--soft)}
h2{font-size:1.7rem;font-weight:900;margin-bottom:18px}
.g{display:grid;gap:16px}.c2{grid-template-columns:repeat(2,1fr)}.c4{grid-template-columns:repeat(4,1fr)}
@media(max-width:900px){.c4{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.c2,.c4{grid-template-columns:1fr}}
.box{background:#fff;border:1px solid var(--ln);border-radius:24px;padding:22px}.box h3{font-weight:900;margin-bottom:4px}.box p{color:var(--mu);font-size:.92rem}
.ck{list-style:none;padding:0;display:grid;gap:14px}.ck li{display:flex;gap:12px;align-items:flex-start}
.ck li:before{content:"✓";flex:none;width:26px;height:26px;border-radius:50%;background:var(--soft);color:var(--ol);display:grid;place-items:center;font-size:.8rem;font-weight:900;margin-top:2px}
.soft .ck li:before{background:#fff}
.sim{display:block;transition:.25s}.sim:hover{transform:translateY(-4px);border-color:var(--ol2)}
.sim b{font:500 1.5rem Fraunces,Georgia,serif;direction:ltr;display:block;text-align:start}.sim b i{font-style:normal;color:var(--ol2)}.sim span{font-size:.85rem;color:var(--mu)}
.note{margin-top:16px;font-size:.85rem;color:var(--mu)}
footer{background:#1c2410;color:rgba(255,255,255,.7);text-align:center;padding:32px 0;font-size:.88rem}footer a{color:var(--lt);font-weight:800}
.hero{padding-bottom:48px;text-align:center}.hero h1{font:500 clamp(2.2rem,7vw,3.4rem) Fraunces,Georgia,serif;direction:inherit;text-align:center;margin-top:10px}body:not(.en) .hero h1{font-family:Cairo,sans-serif;font-weight:900}.hero .lead{margin-inline:auto}
.txt{max-width:760px;margin:0 auto}.txt p{font-size:1.12rem;color:var(--fg);margin-bottom:16px}
.me{display:flex;align-items:center;gap:24px;margin:34px auto 0;max-width:760px;padding-top:30px;border-top:1px solid var(--ln)}.me img{width:150px;height:150px;border-radius:50%;object-fit:cover;flex:none}
.me h2{font-size:1.6rem;margin:0}.me .rl{color:var(--mu);font-weight:700;font-size:.92rem;margin-top:2px}
.me .go{display:inline-block;margin-top:14px;background:var(--ol);color:#fff;font-weight:800;padding:12px 26px;border-radius:99px}.me .go:hover{background:var(--dk)}
@media(max-width:560px){.me{flex-direction:column;text-align:center;gap:14px}.me img{width:140px;height:140px}}
.g3{grid-template-columns:repeat(3,1fr)}@media(max-width:800px){.g3{grid-template-columns:1fr}}.tc{text-align:center}.box{text-align:center}.ico{font-size:1.7rem;margin-bottom:8px}</style>
